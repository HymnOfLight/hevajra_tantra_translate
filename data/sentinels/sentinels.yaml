    status: verified
    verified_by: "code review 2026-09-30"
    source: "code review 2026-09-30, section 2 row 3 (0600c28-0601a16)"
    stage: proposal
    check: linked_local
    loci: {ref_from: "D418:27b.1", ref_to: "D418:28a.1", wit_from: "T0892:0600c28", wit_to: "T0892:0601a15"}
    quotes: {ref_from: "དེ་ནས་ཁ་སྦྱར་འབྱེད་པ་ཡི", ref_to: "རུས་པ་བདེན་པ་བཞི་པོ་ཉིད", wit_from: "欲作降伏法者", wit_to: "七等覺支及四真諦所生"}
    expect: {local: pin18}

  - id: S3b_II9_opening_present
    status: verified
    verified_by: "code review 2026-09-30"
    source: "code review 2026-09-30, section 2 row 3"
    stage: proposal
    check: status_in
    loci: {ref_from: "D418:27b.1", ref_to: "D418:28a.1", wit_from: "T0892:0600c28", wit_to: "T0892:0601a15"}
    quotes: {ref_from: "དེ་ནས་ཁ་སྦྱར་འབྱེད་པ་ཡི", ref_to: "རུས་པ་བདེན་པ་བཞི་པོ་ཉིད", wit_from: "欲作降伏法者", wit_to: "七等覺支及四真諦所生"}
    expect: {statuses: [PRESENT, PARTIAL]}

  # II.9: "kills in an instant" is rendered "subdues in an instant".
