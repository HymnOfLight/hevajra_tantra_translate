    stage: final
    check: linked_local
    loci: {ref_from: "D418:29a.2", ref_to: "D418:29a.2", wit_from: "T0892:0601a15", wit_to: "T0892:0601a17"}
    quotes: {ref_from: "ཨོཾ་ཨཱཿཧཱུྃ་ཕཊ་སྭཱ་ཧཱ", ref_to: "འབྱུང་པོ་ཐམས་ཅད་ཀྱི་གཏོར་མའི་སྔགས་སོ", wit_from: "諸八部真言曰", wit_to: "唵阿吽發吒薩嚩賀"}
    expect: {local: pin18}

