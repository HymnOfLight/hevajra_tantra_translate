  # The translators' colophons (Gayadhara, Shakya ye shes, gZhon nu dpal) follow the final
  # rdzogs so of Toh 418 and are paratext, not alignable content.
  - id: S6_D418_colophon_is_paratext
    status: verified
    verified_by: "code review 2026-09-30"
    source: "code review 2026-09-30, defect table row 4"
    stage: ingest
    check: paratext
    loci: {from: "D418:30a.2", to: "D418:30a.3"}
    quotes: {from: "རྒྱ་གར་མཁན་པོ་ག་ཡ་ཧ་དྷ་རའི་ཞལ་སྔ་ནས་དག", to: "སླར་ཡང་ལོ་ཙྪ་བ་གཞོན་ནུ་དཔལ"}
    expect: {count: 3}

  # I.7: the Derge place lists run from the upacchandoha list (8a.6) straight into the pilava
  # list (8a.7); only the summary line "to be told in brief" lies between. There is no
  # melapaka list, so the Chinese gap at "seventh and eighth" (note 0592a27) is shared with
  # the Tibetan. The Sanskrit manuscripts have not been checked.
  - id: S7_I7_melapaka_gap_shared
    status: proposed
    verified_by: null
    source: "philology design 2026-09-30; re-checked on the Derge by the critique 2026-09-30"
    stage: ingest
    check: adjacent
    loci: {first: "D417:8a.6", second: "D417:8a.7"}
    quotes: {first: "ཀོང་ཀ་ཎ་ཡང་ཉེ་ཙན", second: "འཐུང་གཅོད་གྲོང་ཁྱེར་གྱི་དང་ཡང"}
    expect: {max_between: 1}

