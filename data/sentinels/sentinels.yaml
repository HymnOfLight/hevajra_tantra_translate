    check: relation_in
    loci: {ref_from: "D418:28a.1", ref_to: "D418:29a.2"}
    quotes: {ref_from: "བདག་མེད་མས་གསོལ་བ", ref_to: "བྱིན་ལ་དྲ་ནུ་ཏྤནྣ་ཏྭཱ་ཏ"}
    expect: {relations: [no_counterpart]}

  # Chinese chapter 11 ends with II.1 (homa material and closing mantras in the same order).
  # Taisho footnote 0594008 on the chapter 11 heading gives the colophon closing Part I
  # (vajragarbhabhisambodhi) and footnote 0595012 on the chapter 12 heading the II.1 colophon
  # of Tokyo ms 335: the Taisho matched headings to that manuscript's colophons by ordinal.
  # This supersedes the review's reading of 0595012 as a different chapter division.
  - id: S9_zh11_ends_with_II1
    status: proposed
    verified_by: null
    source: "philology design 2026-09-30; footnotes 0594008 and 0595012 re-checked by the critique 2026-09-30"
    stage: proposal
    check: linked_local
    loci: {ref_from: "D418:14a.3", ref_to: "D418:14a.5", wit_from: "T0892:0595a09", wit_to: "T0892:0595a27"}
    quotes: {ref_from: "ཞི་ལ་ཏིལ་དང་རྒྱས་ལ་ཞོ", ref_to: "ཨོཾ་དྷྭྃ་དྷྭྃ་ལྷ་བཤོས་ཀྱི་སྔགས་སོ", wit_from: "息災用脂麻", wit_to: "唵探探"}
    expect: {local: pin11}

  # II.12: the instruction "on the head the form of om, at the heart hum, on the filament ah"
  # is transliterated as if it were the end of the mantra (sirasi omkaram kiñjalke ahkaram);
  # the heart/hum slot is missing in the Chinese.
  - id: S10_II12_instruction_as_mantra
    status: proposed
    verified_by: null
    source: "philology design 2026-09-30"
    stage: final
    check: relation_in
    loci: {ref_from: "D418:30a.1", ref_to: "D418:30a.2", wit_from: "T0892:0601b23", wit_to: "T0892:0601b23"}
    quotes: {ref_from: "སྤྱི་བོར་ནི་ཨོཾ་གྱི་རྣམ་པ", ref_to: "ཟེ་འབྲུ་ལ་ནི་ཨཱཿའི་རྣམ་པའོ", wit_from: "尸囉細唵歌囕緊拶梨計阿歌犖", wit_to: "尸囉細唵歌囕緊拶梨計阿歌犖"}
    expect: {relations: [transliterated], flags: [instruction_as_mantra]}
