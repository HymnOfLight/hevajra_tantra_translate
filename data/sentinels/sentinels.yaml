# Sentinel facts: collation facts established by close reading, checked on every run.
#
# A sentinel pins one fact to witness-native coordinates, so it survives re-segmentation.
# Only `verified` sentinels block a gate (G0 for stage ingest, G2 for proposal, G3 for
# final); `proposed` ones are evaluated and reported but never block (open question Q1:
# the researcher confirms or rejects them). The checker is hevajra_matrix.evaluation.sentinels.
#
# Fields (all required)
#   id           stable identifier
#   status       proposed | verified | retired
#   verified_by  who verified the fact (required for verified; null otherwise)
#   source       where the fact was established or argued
#   stage        ingest | proposal | final: the first stage at which the fact must hold; the
#                checker also evaluates it at every later stage (ingest < proposal < final)
#   check        one of the 8 check kinds below
#   loci         witness line coordinates "<text>:<line>", e.g. "D418:17b.6", "T0892:0592a27"
#   quotes       short verbatim excerpts, keyed like loci: for human readers, and to pick the
#                segment when a line holds several (a quote must occur in a segment starting
#                on the line of the locus with the same key)
#   expect       the parameters of the check
#
# Ranges: `*_from` .. `*_to` covers the segments from the one starting on the `_from` line
# (the one containing the `_from` quote, if given; else the first on that line) through the
# one starting on the `_to` line (containing the `_to` quote; else the last on that line).
# Only content segments count (prose, verse_line, verse, mantra), except for `paratext`.
#
# Check kinds (loci keys; expect keys)
#   note_kind     {note}; {note_class}: the note starting on that line (containing the quote)
#                 has this class
#   paratext      {from, to}; {count}: the range holds exactly `count` segments, all of kind
#                 paratext, and no content segment of that text follows them
#   adjacent      {first, second}; {max_between}: at most `max_between` content segments lie
#                 between the two segments
#   relation_in   {ref_from, ref_to[, wit_from, wit_to]}; {relations[, polarity_flip][, flags]}:
#                 every reference unit in the range has one of these relations (with this
#                 polarity flag, and carrying all these flags); links, if any, fall in the
#                 witness range
#   status_in     {ref_from, ref_to[, wit_from, wit_to]}; {statuses}: every unit's status is one
#                 of these
#   none_status   {ref_from, ref_to[, wit_from, wit_to]}; {status}: no unit has this status
#   linked_local  {ref_from, ref_to[, wit_from, wit_to]}; {local}: every unit is linked, and
#                 only to witness segments of this witness chapter (and of the witness range)
#   witness_only  {wit_from, wit_to}; {kinds}: every witness segment in the range is
#                 witness-only material of one of these kinds (linked to no reference unit)
#
# Facts checked by the code review of 2026-09-30 are verified with verified_by "code review
# 2026-09-30"; readings first made during the design (S1b, S2b, S7, S8, S9, S10) stay
# proposed even where the critique re-checked the underlying text.

schema_version: 2

sentinels:
  # I.7, the twelve places. The Chinese keeps the places of classes 11-12 (charnel grounds:
  # seashore, orchards, ponds) while dropping the class name; none of them is ABSENT.
  - id: S1a_I7_places_kept
    status: verified
    verified_by: "code review 2026-09-30"
    source: "code review 2026-09-30, section 2 row 1"
    stage: final
    check: none_status
    loci: {ref_from: "D417:8a.7", ref_to: "D417:8b.1", wit_from: "T0892:0592a29", wit_to: "T0892:0592b01"}
    quotes: {ref_from: "དུར་ཁྲོད་རབ་སོན་དགེ་འདུན་དང", ref_to: "ཉེ་བའི་དུར་ཁྲོད་བརྗོད་པར་བྱ", wit_from: "十一者眾所樂處或大海邊", wit_to: "清淨池沼"}
    expect: {status: ABSENT}

  # I.7: the Chinese replaces ALL twelve category names with ordinals ("which twelve? first,
  # ..."), not only the charnel ground: a rendering applied to the whole list (corrects the
  # review's S1, which named only smasana). The critique re-checked that all 12 are replaced.
  - id: S1b_I7_category_names_list_wide
    status: proposed
    verified_by: null
    source: "philology design 2026-09-30; all 12 names replaced, re-checked by the critique 2026-09-30"
    stage: final
    check: relation_in
    loci: {ref_from: "D417:8a.3", ref_to: "D417:8a.4", wit_from: "T0892:0592a19", wit_to: "T0892:0592a20"}
    quotes: {ref_from: "གནས་དང་ཉེ་བའི་གནས་དང་ནི", ref_to: "དུར་ཁྲོད་ཉེ་བའི་དུར་ཁྲོད་ཉིད", wit_from: "當有一十二處遠離魔事", wit_to: "何等十二"}
    expect: {relations: [category_name_omitted], flags: [scope_list, uniform_across_list]}

  # II.3: the Tibetan enjoins killing, lying, stealing and others' wives; the Chinese gives
  # four prohibitions. The meaning is reversed as a whole.
  - id: S2a_II3_vows_reversed
    status: verified
    verified_by: "code review 2026-09-30"
    source: "code review 2026-09-30, section 2 row 2"
    stage: proposal
    check: relation_in
    loci: {ref_from: "D418:17b.6", ref_to: "D418:17b.6", wit_from: "T0892:0596b25", wit_to: "T0892:0596b27"}
    quotes: {ref_from: "ཁྱོད་ཀྱིས་སྲོག་ཆགས་བསད་པ་དང", ref_to: "ཕ་རོལ་བུད་མེད་བསྟེན་པར་གྱིས", wit_from: "一者不應殺害眾生", wit_to: "四者無虛妄語"}
    expect: {relations: [reversal], polarity_flip: true}

  # II.3: the Chinese also reorders the four acts into the standard precept order (kill,
  # steal, sexual misconduct, lie against the Tibetan kill, lie, steal, others' wives).
  - id: S2b_II3_vows_reordered
    status: proposed
    verified_by: null
    source: "philology design 2026-09-30"
    stage: final
    check: relation_in
    loci: {ref_from: "D418:17b.6", ref_to: "D418:17b.6", wit_from: "T0892:0596b25", wit_to: "T0892:0596b27"}
    quotes: {ref_from: "ཁྱོད་ཀྱིས་སྲོག་ཆགས་བསད་པ་དང", ref_to: "ཕ་རོལ་བུད་མེད་བསྟེན་པར་གྱིས", wit_from: "一者不應殺害眾生", wit_to: "四者無虛妄語"}
    expect: {relations: [reversal], flags: [reordered]}

  # II.9: its opening (27b.1-28a.1) is the second half of Chinese chapter 18, in the same order.
