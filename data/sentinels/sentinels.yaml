    quotes: {ref_from: "དམིགས་ནས་སྐད་ཅིག་གསོད་པར་བྱེད", ref_to: "དམིགས་ནས་སྐད་ཅིག་གསོད་པར་བྱེད", wit_from: "剎那降伏", wit_to: "剎那降伏"}
    expect: {relations: [substitution]}

  # Three gathas (12 lines) after the blessing mantra exist in the Chinese only; the Derge
  # goes from the mantra and the seed-syllable instruction straight to the colophons.
  - id: S4_zh_final_gathas_witness_only
    status: verified
    verified_by: "code review 2026-09-30"
    source: "code review 2026-09-30, section 2 row 4"
    stage: final
    check: witness_only
    loci: {wit_from: "T0892:0601c01", wit_to: "T0892:0601c07"}
    quotes: {wit_from: "復說伽陀曰", wit_to: "自他俱利樂"}
    expect: {kinds: [addition]}

  # Translator notes kept by the ingester with their classes (CBETA XML).
  - id: S5a_note_vorlage_statement
    status: verified
    verified_by: "code review 2026-09-30"
    source: "code review 2026-09-30, section 2 (aside) and defect table row 5; CBETA XML"
    stage: ingest
    check: note_kind
    loci: {note: "T0892:0592a27"}
    quotes: {note: "七者、八者，梵本元闕"}
