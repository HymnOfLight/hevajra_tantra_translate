  - id: tokyo335
    description: >
      Sanskrit manuscript no. 335 of Tokyo Imperial University, cited in Taishō footnote
      0587005 ("東京帝國大學梵本三百三十五號") as collated for T0892. It is not the Chinese
      translator's Vorlage, so the Vorlage question stays open. The Taishō editors matched
      Chinese chapter headings to its colophons by ordinal (footnotes 0594008, 0595012).
      Whether it is one of Conlon's manuscripts is to be checked.
    group: to_verify
    independence: to_verify
    shelfmark: to_verify
    source: "Taishō T0892 footnotes (CBETA XML); synthesis 0.2; critique 2026-09-30"
    access: "indirect only: 16 Taishō footnotes marked （梵本） report its readings (ingest Footnote.source = tokyo335)"
