# 《喜金刚本续》(Hevajratantra) 见证清单 —— 见证矩阵的“列”定义
#
# 字段说明
#   id            机器标识，矩阵列名
#   lang          sa / bo / zh / txg(西夏) / mn / en
#   layer         primary   直接见证（该语言的独立古代文本）
#                 edition   现代校勘本（对同一语言写本传承的重构，视作“带编者干预的见证”）
#                 indirect  注疏引文等间接见证（只在被引出的偈颂上有值）
#                 pivot     现代译本，只作检索/复核桥梁，不进入偏移统计
#   source_lang   该见证的直接来源语言（译出方向）；null 表示本身即梵文
#   date          成书 / 译出年代（尽可能给出依据）
#   independence  相对梵文金标准的独立性评级：
#                 independent  直接译自梵文，与其他译本无从属关系
#                 derived      译自另一译本（如藏→汉、藏→西夏），只能作为其来源列的“二阶见证”
#                 revised      在早期译本基础上修订（如德格本经 15 世纪贡译师修订）
#                 unknown
#   status        available / license_restricted / to_verify / not_digitized
#   role          gold / reference_variant / target / control / pivot / indirect
#   notes         必须诚实标注“待核”事项，不得在未核实时填入具体编号
#
# 约定：梵文金标准不是单一文本，而是 sa_* 各列构成的“金标准分布”（见 docs/02_矩阵与偏移度量.md §2）。

