  # ---------------------------------------------------------------- 汉文层
  - id: zh_T0892_song
    lang: zh
    layer: primary
    source_lang: sa
    title: "佛說大悲空智金剛大教王儀軌經，五卷，宋 法護 譯（T18 no. 892）"
    translator: "法護（Dharmapāla / *Dharmarakṣa）"
    date: "约 1054–1055（84000 作 1055；Isaacson 作 1054–1055；DILA 仅给法护活动年限 1004–1058）"
    independence: independent
    status: available
    role: target
    source_url: "https://github.com/cbeta-org/xml-p5 (T/T18/T18n0892.xml)"
    license: "CC BY-NC-SA 4.0 (CBETA)"
    coords: "大正藏 卷/页/栏/行，如 0587c06；20 品"
    notes: >
      卷一经题下夹注「大幻化普通儀軌三十一分中略出二無我法」对应藏文全经卷末题记
      （藏作“三十二”），是经文对自身来源的传统自述，不是汉译者自陈删略（见评估文 §4.1）。
      因此不预设“摘出边界”，整品缺失只能靠逐品对齐确定。
      与藏译几乎同时（相差约十年）、各自直接译自梵文——构成同源双译对照。

