  # ---------------------------------------------------------------- 藏文层
  - id: bo_derge_D417_418
    lang: bo
    layer: primary
    source_lang: sa
    title: "ཀྱེའི་རྡོ་རྗེ་ཞེས་བྱ་བ་རྒྱུད་ཀྱི་རྒྱལ་པོ (brTag pa gnyis pa)，德格甘珠尔 Toh 417–418"
    translator: "Gayadhara（印度）＋ 'Brog mi Shākya ye shes（藏）"
    date: "初译 11 世纪（约 1040 年代）；德格本颂尾题记明言后经 lo tsā ba gZhon nu dpal 补阙订正"
    independence: revised
    status: available
    role: target
    source_url: "https://github.com/Esukhia/derge-kangyur (text/080_རྒྱུད་འབུམ།_ང.txt, {D417}–{D419})"
    coords: "叶.行，如 13b.5；Toh 417 = 1b.1–13b.5，Toh 418 = 13b.5–30a.3"
    notes: >
      关键事实：德格本不是 11 世纀译文的原貌。题记「སླར་ཡང་ལོ་ཙྪ་བ་གཞོན་ནུ་དཔལ་གྱིས་འགྱུར་ཆད་པས་བས་ཤིང་དག་པར་བགྱིས་པའོ」
      表明贡译师童祥（1392–1481）补足了脱文并作校正。因此藏文层必须多列，
      不能把德格本当作“藏译”的唯一代表。

  - id: bo_kangyur_other
    lang: bo
    layer: primary
    source_lang: sa
    title: "其他甘珠尔版本（北京、那塘、卓尼、拉萨、乌尔嘎、斯托克宫、伦敦/协噶尔、普扎等）"
    date: "13–18 世纀刻本/抄本"
    independence: revised
    status: to_verify
    role: reference_variant
    notes: >
      目的：分离“贡译师修订层”与“卓弥初译层”。Them spangs ma 系与 Tshal pa 系
      分别取至少一部作对照列；普扎（Phug brag）本常保留独立读法。
      数字化状态与许可（rKTs / BDRC / ACIP）待逐一核对。

