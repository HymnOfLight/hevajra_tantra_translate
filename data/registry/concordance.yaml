# Chapter concordance, schema version 2, read by hevajra_matrix.registry.load_concordance.
#
# Rows are the reference chapters in Snellgrove's numbering (I.1-I.11, II.1-II.12). For every
# witness, `spans` lists where (part of) the chapter lies in that witness:
#   local      witness-local chapter key (as the ingester writes Segment.local_chapter);
#              null exactly when the span is absent
#   status     proposed          from titles, order and length ratios; not checked unit by unit
#              verified          checked in the source texts (source names by whom)
#              absent_candidate  no counterpart found so far; to be verified unit by unit
#              absent            absence verified unit by unit
#   ref_from, ref_to   optional, inclusive reference-witness line coordinates when the span
#              covers only part of the chapter (lines are coarse: neighbouring spans may
#              share their boundary line)
#   evidence   why the mapping holds; source  who established it
#
# The concordance only proposes where the collator should look first (the "core window":
# mapped chapters +/- neighbours). The collator sees the full witness text, and a link
# outside the window is reported as a relocation, never prevented. The Chinese has 20
# chapters against 23; where the 3 went is decided by unit-level alignment, never by the
# title note under the first fascicle heading (see witnesses.yaml, zh_T0892_song).
#
# Length ratios quoted below (Chinese characters / Tibetan syllables; mean over the text
# 0.74) come from the v0.2 concordance.

schema_version: 2
reference_scheme: sa_snellgrove1959

witnesses:
  bo_derge_D417_418:
    locals: ["D417:1", "D417:2", "D417:3", "D417:4", "D417:5", "D417:6", "D417:7", "D417:8", "D417:9",
