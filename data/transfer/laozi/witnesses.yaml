# 《老子》诸本见证清单（迁移研究，docs/05）
#
# 参照：通行本（王弼本）81 章的章/句坐标 —— 只是坐标系，不是金标准（reference_grade=coordinate_only）。
# 文本文件：data/transfer/laozi/texts/<id>.txt（.gitignore 排除；格式见 README.md）。
# scope：complete 完整本 | anthology 选编本（未收章 → NA，不是 ABSENT）| fragment 残卷 | quotation 引文
# cowitness：三分分解时用作"独立同源见证"的列（同语言场景下即"另一早期见证亦缺"）。
# 日期与整理本信息均为常见说法，标 待核 者尚未逐条核对。

witnesses:
  - id: zh_wangbi
    label: 王弼本（通行本坐标）
    layer: edition
    scope: complete
    date: 三国魏（226–249）注；今传本以浙江书局《二十二子》/《四部要籍注疏丛刊》等为底本；楼宇烈校释 1980
    reference: true
    file: zh_wangbi.txt
    note: 参照坐标系。王弼本经文本身经过宋以后传抄，非王弼原貌（待核：与《道藏》本差异）。

  - id: zh_heshanggong
    label: 河上公章句本
    layer: edition
    scope: complete
    date: 东汉？（成书年代有争议：西汉说、东汉说、魏晋说）
    cowitness: zh_wangbi
    file: zh_heshanggong.txt
    note: 与王弼本同属通行本系统；两者之差近似"同一传承内的抄传噪声"，是 σ_S 的下界估计。

  - id: zh_fuyi
    label: 傅奕校定古本
    layer: edition
    scope: complete
    date: 唐初（傅奕 555–639），据项羽妾墓本等古本校定
    cowitness: zh_wangbi
    file: zh_fuyi.txt
    note: 常与马王堆本合读；虚词较多，篇幅偏长（d_len 基线需单列）。

  - id: zh_mawangdui_A
    label: 马王堆汉墓帛书《老子》甲本
    layer: primary
    scope: complete
    date: 西汉初（不避"邦"字讳 → 高祖之前，约前 206 年前后）
    cowitness: zh_mawangdui_B
    file: zh_mawangdui_A.txt
    note: 篆隶之间；残损较多（□ → LACUNA）；德经在前，道经在后，章序偏移是主要测量。

  - id: zh_mawangdui_B
    label: 马王堆汉墓帛书《老子》乙本
    layer: primary
    scope: complete
    date: 西汉文帝时期（避"邦"讳、不避"恆"讳 → 前 180 年前后）
    cowitness: zh_mawangdui_A
    file: zh_mawangdui_B.txt
    note: 隶书；保存较好；与甲本构成"同源两写本"，可在同一时代层内估 σ_S。

  - id: zh_beida_han
    label: 北京大学藏西汉竹书《老子》
    layer: primary
    scope: complete
    date: 西汉中期（武帝前后，待核）
    cowitness: zh_mawangdui_B
    file: zh_beida_han.txt
    note: 分上下经，标"老子上经/下经"，有章节符号与章数；是通行本分章之外最早的分章证据（待核：北大简整理报告 2012）。

  - id: zh_guodian_A
    label: 郭店楚简《老子》甲组
    layer: primary
    scope: anthology
    date: 战国中期偏晚（约前 300 年，墓葬年代）
    cowitness: zh_mawangdui_B
    file: zh_guodian_A.txt
    note: 39 枚简；收约 20 章之全部或部分，章序与通行本大异（见 concordance.yaml）；未收章一律 NA。

  - id: zh_guodian_B
    label: 郭店楚简《老子》乙组
    layer: primary
    scope: anthology
    date: 同上
    cowitness: zh_mawangdui_B
    file: zh_guodian_B.txt
    note: 18 枚简，约 8 章。

  - id: zh_guodian_C
    label: 郭店楚简《老子》丙组
    layer: primary
    scope: anthology
    date: 同上
    cowitness: zh_mawangdui_B
    file: zh_guodian_C.txt
    note: 14 枚简，约 5 章；含第 64 章下半的第二个抄本（与甲组构成同墓同章双抄，σ_S 的最小尺度样本）。

  - id: zh_xianger_S6825
    label: 敦煌《老子想尔注》残卷 S.6825
    layer: primary
    scope: fragment
    date: 抄本六朝；注文成于东汉末（张鲁？待核）
    cowitness: zh_heshanggong
    file: zh_xianger_S6825.txt
    note: 存第 3–37 章经文；经文与河上公本接近但有天师道改字（如"道大、天大、地大、王大"→"生大"），是"有立场的改写"之候选层。

  - id: zh_yanzun
    label: 严遵《老子指归》所存经文
    layer: indirect
    scope: fragment
    date: 西汉末（严遵，前 1 世纪）；今本仅存德经部分
    file: zh_yanzun.txt
    note: 经文部分真伪有争（待核）。

  - id: zh_hanfeizi_jielao
    label: 《韩非子·解老》《喻老》引文
    layer: indirect
    scope: quotation
    date: 战国末（前 3 世纪后期）
    file: zh_hanfeizi.txt
    note: 最早的系统引用之一；引文按所释章标注 #N，只覆盖被引句。

  - id: zh_huainanzi_quotes
    label: 《淮南子》引《老子》
    layer: indirect
    scope: quotation
    date: 西汉初（前 139 年成书）
    file: zh_huainanzi.txt
    note: 常以"故老子曰"引出；引文形态介于马王堆与通行本之间（待核）。

# 外部复现集（不进矩阵，用于检验方法论迁移性主张）
external_replication_sets:
  - 《文子》《庄子》《吕氏春秋》中的《老子》引文
  - 唐景龙二年易州龙兴观道德经碑（碑刻本，706）
  - 唐玄宗御注本、宋范应元《老子道德经古本集注》所记异文
