# Near misses: similar strings that are not one of the seven note types.
unclassified:
  - "二合下"        # a fusion mark followed by a dangling 'lower'
  - "引二"          # a phonetic mark and a numeral run together
  - "第三卷"        # a fascicle number without 'same scroll'
  - "梵文"          # 'Sanskrit script', not 'Sanskrit manuscript'
  - "呂角"          # a fanqie pair without the fanqie mark
  - ""              # empty note
