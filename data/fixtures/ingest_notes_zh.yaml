# Every distinct inline-note text of CBETA T0892 (48, from the real XML; short quotes) with
# its expected class, plus texts that must stay unclassified. Used by
# tests/unit/test_ingest_notes.py to check data/lexicon/notes_zh.yaml: each classified text
# matches exactly one rule, and the right one. Line breaks inside a note are kept as in the
# source (CBETA breaks two notes across lines).

classified:
  - {text: "大幻化普通儀軌三十一分中略出二無我法", class: title}
  - {text: "引", class: phonetic}
  - {text: "一", class: mantra_numbering}
  - {text: "三", class: mantra_numbering}
  - {text: "半音", class: phonetic}
  - {text: "引下同", class: phonetic}
  - {text: "四", class: mantra_numbering}
  - {text: "二", class: mantra_numbering}
  - {text: "二合引", class: phonetic}
  - {text: "五", class: mantra_numbering}
  - {text: "二合", class: phonetic}
  - {text: "六", class: mantra_numbering}
  - {text: "七", class: mantra_numbering}
  - {text: "八", class: mantra_numbering}
  - {text: "九", class: mantra_numbering}
  - {text: "十", class: mantra_numbering}
  - {text: "十一", class: mantra_numbering}
  - {text: "十二", class: mantra_numbering}
  - {text: "十三", class: mantra_numbering}
