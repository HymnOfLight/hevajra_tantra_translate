# Standing renderings of the witness zh_T0892_song against bo_derge_D417_418 (collate.v2).
#
# A standing rendering is a term that the witness renders the same way throughout the
# text, as a convention of the translation. collate.v2 shows the listed entries to the
# collator after the examples; a unit whose only difference from its rendering is a
# listed entry gets convention standing_rendering and is judged as if the rendering were
# the reference term (normally equivalent or paraphrase). The code check V12 accepts that
# convention only when the unit's witness quote contains a listed rendering and its
# reference quote a reference form of the same entry; otherwise the unit is flagged
# convention_unsupported.
#
# Only entries with status: verified are shown to the collator (and accepted by V12); while
# none is verified the prompt shows "(none)". An entry is verified by a researcher who has
# checked the counts and the passages (verified_by: real name). Verifying an entry, or
# editing, retiring or removing a verified one, changes the prompt, hence the collate
# instrument digest and every cache key (an instrument change; see README.md). Adding,
# editing, retiring or removing a proposed entry changes nothing the model sees.
#
# Every entry needs id, reference_forms, witness_renderings and status (proposed |
# verified | retired; a missing status is refused on load). verified_by is a non-blank
# real name for verified and null otherwise. sanskrit, counts and note are optional; any
# other key is refused. A new entry starts with status: proposed and verified_by: null.
#
# Counts are plain substring counts over the ingested texts (Derge D417-418 including
# every kind; T0892 excluding note lines), made on 2026-10-10 from run
# runs/pilot-20261010T145135Z. They are evidence for the decision, not proof: a
# substring count does not show that every occurrence renders the listed term.

schema_version: 1
reference: bo_derge_D417_418
witness: zh_T0892_song

entries:
  - id: hevajra
    reference_forms: ["ཀྱེའི་རྡོ་རྗེ", "ཀྱེ་ཡི་རྡོ་རྗེ", "ཀྱེ་རྡོ་རྗེ"]
    sanskrit: Hevajra
    witness_renderings: ["大悲空智金剛", "空智金剛"]
    counts:   # plain substring counts
      - {side: reference, form: "ཀྱེའི་རྡོ་རྗེ", n: 24}
      - {side: reference, form: "ཀྱེ་ཡི་རྡོ་རྗེ", n: 13}
      - {side: reference, form: "ཀྱེ་རྡོ་རྗེ", n: 8}
      - {side: witness, form: "空智金剛", n: 18}
      - {side: witness, form: "大悲空智金剛", n: 11}
    note: >-
      The name of the deity and of the tantra. The listed witness renderings are (da bei)
      kong zhi jin gang (18 occurrences). The witness also names Hevajra jin gang kong zhi
      (10), kong zhi da jin gang wang (3) and kong zhi zhu (1), e.g. D418:22a.7.8 =
      T0892:0598b08.1 and D418:23b.1.5 (abbreviated kye rdor, not listed either) =
      T0892:0598c19.2; whether to list these is left to the verifying expert (corrected
      2026-10-13; an earlier note said kong zhi forms other than the full name render only
      the syllable he and Heruka). The reference has about 45 occurrences (one of the 8
      kye rdo rje hits, D418:18a.7.1, is probably the vocative kye kye before rdo rje mkha'
      'gro ma); occurrences without a name in the witness are judged by the ordinary
      tests. Bare kong zhi for the syllable he and for Heruka is not a standing rendering
      (see considered_not_listed).
    status: proposed
    verified_by: null

# Terms examined for the list and left out, with the reason. Recorded so that the
# decision can be reviewed; an expert may move any of them into entries.
considered_not_listed:
  - id: heruka
    reference_forms: ["ཧེ་རུ་ཀ"]
    witness_renderings_seen: ["空智", "呬嚕迦"]
    counts:   # plain substring counts
      - {side: reference, form: "ཧེ་རུ་ཀ", n: 15}
      - {side: witness, form: "呬嚕迦", n: 3}
    reason: >-
      Rendered sometimes by kong zhi and sometimes by sound (xi lu jia); not one rendering
      throughout. Its transcriptions fall under the convention transcribed_name anyway.
  - id: he_syllable
    reference_forms: ["ཧེ", "ཀྱེ"]
    witness_renderings_seen: ["空智"]
    reason: >-
      In the explanation of the syllables of the name (I.1), the witness puts kong zhi
      where the reference explains the sound he. Whether that is a convention or a
      change of content (the syllable explanation is lost) is a philological decision;
      left to the ordinary tests until an expert decides.
  - id: dakini
    reference_forms: ["མཁའ་འགྲོ་མ"]
    witness_renderings_seen: ["拏吉尼", "空行"]
    counts:   # plain substring counts
      - {side: reference, form: "མཁའ་འགྲོ་མ", n: 21}
      - {side: witness, form: "拏吉尼", n: 11}
      - {side: witness, form: "空行", n: 5}
    reason: >-
      Rendered by sound (na ji ni) and by meaning (kong xing). Not a single rendering; a
      class noun rendered by sound is transliterated content under the current rules,
      which is a decision for the codebook (docs-zh/09-collate-v2-draft.md, question Q3).
  - id: yogini
    reference_forms: ["རྣལ་འབྱོར་མ"]
    witness_renderings_seen: ["瑜儗尼", "明妃"]
    counts:   # plain substring counts
      - {side: reference, form: "རྣལ་འབྱོར་མ", n: 49}
      - {side: witness, form: "瑜儗尼", n: 6}
      - {side: witness, form: "明妃", n: 105}
    reason: >-
      Rendered by sound only rarely. The witness uses ming fei very often (105 times),
      apparently for several reference terms (yogini, goddess, consort); whether that is a
      generalisation is exactly what the collation should measure, so it is not listed.
