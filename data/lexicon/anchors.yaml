# Cross-lingual alignment anchors: Sanskrit <-> Tibetan (Derge D417/418) <-> Chinese (T0892).
#
# Read by hevajra_matrix.align.anchors.load_anchor_lexicon. The B0 baseline reduces every
# segment to its set of anchor keys ("<type>:<key>", e.g. "term:kapāla" for the skull cup,
# plus "num:<n>" for numerals, which come from numerals.yaml) and aligns by the overlap
# of these sets. Only correspondences that actually occur in T0892 and D417/418 and whose
# meaning is stable are listed; a false anchor misleads the aligner more than a missing one.
#
# Schema (one record per anchor under "anchors"; unknown fields are rejected):
#   key      IAST name of the anchor, no spaces or ':'; unique together with type
#   type     name (deities and persons) | term | mantra | place
#   sa       Sanskrit forms (IAST); each word matches the beginning of a word, so inflected
#            forms that keep the whole stem match (a changed final vowel does not)
#   bo       Tibetan forms; a form matches whole syllables only. Tibetan fuses some case
#            particles into the last syllable (genitive, agentive, terminative), and those
#            fused forms are different syllables, so they are listed as forms of their own
#            where they occur in D417/418 (e.g. the agentive of Vajragarbha, 23 segments).
#   zh       Chinese forms, at least two characters each: single characters recur inside
#            transliterations (the loader rejects them). Traditional characters, as in T0892.
#   exclude  optional, per language: contexts in which no form of this anchor counts
#            (a form overlapping an occurrence of a context is ignored)
#   note     optional English remark
# sa, bo and zh are all required: an anchor that can fire in one witness only lowers the
# similarity of every correct bead that contains it.
#
# Matching is leftmost-longest across the whole lexicon, so a longer form (the name
# Hevajra) consumes its tokens before a shorter one (vajra) can match inside it.
# A form may belong to one anchor only.
#
# Counts in this file are segments of the real texts (T0892 prose and verse; D417/418 prose,
# verse and mantra) surveyed on 2026-09-30.
#
# Inclusion rule: the forms are translation equivalents AND the anchor fires in comparable
# numbers of segments in T0892 and D417/418 (within a factor of about 4, small counts
# aside). An anchor that T0892 systematically renders otherwise could fire in one witness
# only, and a one-sided anchor lowers the similarity of the correct bead. Removed from the
# v0.2 list for that reason (segment counts zh / bo with the best available forms):
#   mamsa (flesh; the Chinese character occurs once, in a list at 0601a14, and the Tibetan
#     syllable also occurs in mantra transliterations; v0.2 matched it inside other
#     syllables in 218 Tibetan segments), madya (alcohol; 0 / 9),
#   vidya (consort; T0892 appends this title to every goddess name; 104 / 5),
#   jnana (the Chinese character is mostly part of the Hevajra name), samadhi (the Tibetan
#     term does not occur in D417/418; 9 / 0), yogini (6 / 42), krodha (24 / 5),
#   heruka (3 / 15), bhaga (1 / 12), om and hum (single characters in Chinese),
#   pancamrta (merged into amrta; the numeral 5 is an anchor of its own).

