# Orthographic variant forms, read by core.lexicon.load_variant_forms and applied by
# core.textnorm.fold_variants to BOTH strings of a comparison.
#
# Used when a verbatim quote check fails: if the quote matches after folding, the link
# is kept with the flag quote_variant_form (grade C, reviewed by a human) instead of
# being rejected. Each record maps a form to the representative of its variant class;
# a representative must not itself be listed as a form (folding is idempotent).
#
# zh: simplified or variant characters -> the form used by CBETA T0892. A simplified
#     character with two traditional sources (e.g. the one shared by "hair" and "to
#     send") is left out rather than guessed.
# sa: transliteration conventions (ISO 15919, anusvara dot above) -> IAST.
# bo: no folding yet; Esukhia corrections are resolved at ingest.

