# 章级同本系概表（G0 关口的输入，不是结论）
#
# 行 = 梵文金标准的品（Snellgrove 1959 编号：I.1–I.11, II.1–II.12）
# 列 = 各见证中的对应品及其定位
# status:
#   proposed   仅据品名/题记推定，未经逐偈对齐核实
#   verified   已由逐偈对齐与两位文献学者签署确认
#   absent     经逐偈对齐确认该见证无对应品（整品缺失）
#   merged     该见证将本品与相邻品合并（在 merged_into 注明）
#   uncertain  品名不对应，需逐偈对齐后判定
#
# 重要：汉译 20 品 vs 梵/藏 23 品的差额（3 品）来自何处，只能由逐偈对齐决定。
# 不得依据卷一夹注「三十一分中略出」反推“摘出边界”（见 docs/01 §3.1）。

