[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hevajra-matrix"
version = "0.3.0"
description = "Validated, evidence-graded collation of the Hevajratantra witnesses (Tibetan, Chinese, Sanskrit) with Claude Opus 5.5 as a verified proposal instrument"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
claude = ["anthropic>=1,<2"]
dev = ["pytest>=7"]

[project.scripts]
hevajra-matrix = "hevajra_matrix.cli:main"

[tool.setuptools.packages.find]
include = ["hevajra_matrix*"]

[tool.setuptools.package-data]
hevajra_matrix = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "realdata: needs the fetched source texts (set HEVAJRA_RAW_DIR)",
    "live: calls the Anthropic API (set ANTHROPIC_API_KEY); never run in CI",
]
