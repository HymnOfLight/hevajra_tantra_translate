[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hevajra-matrix"
version = "0.2.0"
description = "Witness-matrix pipeline for measuring translation/transmission deviation of the Hevajratantra against its Sanskrit reference distribution, with local open-weight LLM roles and transfer to same-language multi-witness texts (Laozi)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]
embeddings = ["sentence-transformers>=2.2"]
llm-local = ["torch>=2.7", "transformers>=4.51", "accelerate>=1.0", "bitsandbytes>=0.45"]  # in-process loading on the 5090; vLLM serving needs no extra here

[project.scripts]
hevajra-matrix = "hevajra_matrix.cli:main"

[tool.setuptools.packages.find]
include = ["hevajra_matrix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
